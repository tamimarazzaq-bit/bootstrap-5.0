<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="s">
</head>
<body>
<section id="contact-section" class="py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 text-white" style="background-color: #3f5778; border-radius: 15px;">
          <div class="card-body p-4 p-md-5">

             <div class="text-center mb-4">
              <h2 class="fw-bold text-white">Contact Our Shoe Store</h2>
              <p class="text-white-50">"Have a Question? We’re Here to Help!"
Ask us anything about sizes, styles, or your current orders.</p>
            </div>
            
            <!-- Form -->
            <form>
              <div class="mb-3">
                <label for="userName" class="form-label fw-semibold">Your Name</label>
                <input type="text" class="form-control form-control-lg border-0" id="userName" placeholder="Enter your name" style="border-radius: 10px;">
              </div>
              
              <div class="mb-3">
                <label for="userEmail" class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control form-control-lg border-0" id="userEmail" placeholder="name@example.com" style="border-radius: 10px;">
              </div>
              
              <div class="mb-4">
                <label for="userMessage" class="form-label fw-semibold">Message / Shoe Size & Article</label>
                <textarea class="form-control form-control-lg border-0" id="userMessage" rows="4" placeholder="Type your message here..." style="border-radius: 10px;"></textarea>
              </div>
              
              <div class="d-grid">
                <button type="submit" class="btn btn-light btn-lg fw-bold" style="color: #3f5778; border-radius: 10px;">
                  Send Message
                </button>
              </div>
            </form>
            
          </div>
        </div>
      </div>
      
    </div>
  </div>
</section>

   

 
      
</body>
</html>

</body>
</html>
